logLevel: info
logDestinations: [stdout]

api: false
metrics: false
playback: false

rtsp: true
rtspAddress: 127.0.0.1:8554
rtmp: false
srt: false
webrtc: false

hls: true
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
hlsAllowOrigins: ["*"]

pathDefaults:
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 30s
  sourceOnDemandCloseAfter: 30s
  rtspTransport: tcp

paths:
  jetty01:
    # remote: URL HLS/RTSP. file: publisher dari FFmpeg lokal.
    # Diisi oleh MTX_PATHS_JETTY01_SOURCE dari scripts/run_mediamtx.sh.
    source: publisher
